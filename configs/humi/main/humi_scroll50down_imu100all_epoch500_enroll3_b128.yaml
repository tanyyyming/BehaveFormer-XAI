GPU: "True"
data:
    scroll_sequence_len: 50
    imu_sequence_len: 100
    action_type: "down"
dataname: "humi"
hyperparams:
    init_epoch: 0
    epochs: 500
    batch_size: 128
    epoch_batch_count: 100
    target_len: 64
    gre_k: 20
    scroll_feature_dim: 8
    scroll_temporal_heads: 4
    scroll_channel_heads: 10
    imu_temporal_heads: 6
    imu_channel_heads: 10
    imu_type: "acc_gyr_mag"  # each imu sensor has 12 features
    num_imu: 3
    num_prototypes: 16
    prototype_projection_epoch_interval: 20
    lambda_r1: 0.1
    lambda_r2: 0.1
    lambda_pdl: 1.0
    number_of_enrollment_sessions: 3
    number_of_verify_sessions: 2
    learning_rate: 0.001
    warmup_baselr: 1.0e-7
    warmup_epochs: 5

folders: 
    root_dir: "./"
    data_dir: "./data/humidb/scroll50downup_imu100"

data_split:  # this is set in the data preprocessing config and copied here
    training: 298
    validation: 65
    testing: 65